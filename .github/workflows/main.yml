# On every push to main:
#   1. test: typecheck, unit tests, migrations and pgTAP in PGlite
#   2. deploy: apply new migrations to the production Supabase project
#      and deploy the edge function. Runs in the `production` GitHub
#      Environment, whose secrets only `main` can use.
#   3. release: semantic-release reads the conventional commits since the
#      last tag. If they call for a release (fix: patch, feat: minor,
#      BREAKING CHANGE: major), it sets the version in package.json,
#      builds the binaries with it, commits package.json, tags that
#      commit v<version> and publishes a GitHub release with the binaries
#      and SHA256SUMS. It also publishes the bundled package in dist/npm
#      to npm with trusted publishing (OIDC, no token). An extension installed at that tag downloads
#      exactly those binaries.
# Production changes before the release, so a new client never meets an
# old schema. Migrations have to keep working for the previous release.
# Never write the skip marker in a commit message: GitHub skips CI for
# any push whose head commit mentions it, even in prose.
name: main

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: bun test
      - run: pnpm test:db:local

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      # link stores the session pooler's address only if the token may read
      # it; without it, db push tries the IPv6-only direct host, which
      # GitHub's runners can't reach.
      - name: Link
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_ID"
          test -s supabase/.temp/pooler-url || {
            echo "::error::no pooler address; the access token needs database_pooling_config_read"
            exit 1
          }
      - name: Migrations
        run: |
          supabase db push --remote --dry-run
          supabase db push --remote --yes
      # --use-api bundles on Supabase's side (no Docker); the function
      # checks the token itself.
      - run: supabase functions deploy upload-url --use-api --no-verify-jwt --yes

  release:
    needs: deploy
    runs-on: macos-latest # signs the darwin binaries; cross-compiles linux
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v5
      - run: pnpm install --frozen-lockfile
      # npm publishes with OIDC from 11.5.1 on. The plugin runs whichever npm
      # it finds: pnpm doesn't link the one it bundles into node_modules/.bin,
      # so without this it's Node 22's npm 10, which finds no credentials
      # (ENEEDAUTH) even though the plugin's own OIDC check passes.
      - run: npm install --global npm@11
      # @semantic-release/npm checks dist/npm/package.json before the
      # release; prepare rebuilds it with the new version.
      - run: bun scripts/build-npm.ts
      - run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ github.token }}
